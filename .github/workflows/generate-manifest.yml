name: Generate manifest.json

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate manifest.json using Python
        run: |
          python3 - << 'EOF'
          import os, json

          cards_dir = "cards"
          manifest = {}

          for fname in os.listdir(cards_dir):
              if not fname.lower().endswith((".jpg", ".png")):
                  continue
              slug = os.path.splitext(fname)[0]
              manifest[slug] = fname

          manifest = dict(sorted(manifest.items()))

          with open(os.path.join(cards_dir, "manifest.json"), "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)

          print(f"Generated manifest.json with {len(manifest)} entries")
          EOF

      - name: Commit manifest.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add cards/manifest.json
          git commit -m "Generate manifest.json" || echo "No changes"
          git push
